<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devbhoomi Rudraksha Kendra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="sale-banner">
🕉 Mahashivratri Mahotsav Sale — Up to 30% OFF on Authentic Devbhoomi Rudraksha
</div>

<header class="hero">
  <video autoplay muted loop class="bg-video">
    <source src="https://cdn.coverr.co/videos/coverr-hiker-walking-in-the-mountains-9711/1080p.mp4" type="video/mp4">
  </video>

  <div class="hero-text">
    <h1>Devbhoomi Rudraksha Kendra</h1>
    <p>Authentic Rudraksha from Haridwar (Devbhoomi) to Prayagraj (Sangamnagri)</p>
    <button onclick="scrollToShop()">Shop Now</button>
  </div>
</header>

<section id="shop">
<h2>Sacred Rudraksha Collection</h2>
<div id="products"></div>
</section>

<!-- CART -->
<div id="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</div>

<div id="cart-box">
<h3>Your Cart</h3>
<div id="cart-items"></div>
<button onclick="toggleCart()">Close</button>
</div>

<!-- CHATBOT -->
<div id="chatbot">
<div id="chat-header">🧿 Sahayak</div>
<div id="chat-body"></div>
<input id="chat-input" placeholder="Ask about Rudraksha..." onkeydown="chatEnter(event)">
</div>

<script src="script.js"></script>
</body>
</html>
